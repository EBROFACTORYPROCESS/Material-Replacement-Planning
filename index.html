<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPO - Business Process Orchestrator</title>
    <link rel="stylesheet" href="style.css?v=1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <style>
        #app-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #1e3c72;
            flex-direction: column;
            gap: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2a5298;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app-loading">
        <div class="spinner"></div>
        <div>⏳ Loading latest data...</div>
        <div style="font-size:0.8rem;color:#94a3b8;">The first load might take a few seconds</div>
    </div>

    <div id="app-root" style="display:none;"></div>

    <!-- ============================================================
         CDN Libraries - Correct URLs
         ============================================================ -->
    <!-- LZString - CORRECT URL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <!-- jsondiffpatch - Using a reliable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsondiffpatch/0.4.1/jsondiffpatch.umd.min.js"></script>
    
    <!-- Interact.js for drag and drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/interact.js/1.10.27/interact.min.js"></script>
    
    <!-- Core app -->
    <script src="app.js?v=2"></script>
</body>
</html>
